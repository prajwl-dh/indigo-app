name: build-indigo

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

env:
    CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
    verify:
        name: Verify
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build

    build:
        name: Build ${{ matrix.artifact_name }}
        needs: verify
        strategy:
            fail-fast: false
            matrix:
                include:
                    # =====================
                    # LINUX
                    # =====================
                    - os: ubuntu-24.04
                      build_script: build:linux
                      artifact_name: indigo-linux-x64

                    - os: ubuntu-24.04-arm
                      build_script: build:linux
                      artifact_name: indigo-linux-arm64

                    # =====================
                    # MACOS
                    # =====================
                    - os: macos-15
                      build_script: build:mac-arm
                      artifact_name: indigo-macos-apple-silicon

                    - os: macos-15-intel
                      build_script: build:mac-intel
                      artifact_name: indigo-macos-intel

                    # =====================
                    # WINDOWS
                    # =====================
                    - os: windows-2025
                      build_script: build:win
                      artifact_name: indigo-windows-x64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Electron app
              run: npm run ${{ matrix.build_script }}

            # =====================
            # PREPARE RELEASE FILES
            # =====================
            - name: Prepare release files (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  mkdir -p release

                  if [[ "${{ matrix.artifact_name }}" == "indigo-macos-apple-silicon" ]]; then
                      cp dist/*-arm64.dmg "release/Indigo-${{ github.ref_name }}-Mac-Apple-Silicon.dmg"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-macos-intel" ]]; then
                      cp dist/*-x64.dmg "release/Indigo-${{ github.ref_name }}-Mac-Intel.dmg"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-linux-arm64" ]]; then
                      cp dist/*-arm64.AppImage "release/Indigo-${{ github.ref_name }}-Linux-ARM64.AppImage"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-linux-x64" ]]; then
                      cp dist/*-x86_64.AppImage "release/Indigo-${{ github.ref_name }}-Linux-x64.AppImage"

                  else
                      find dist -maxdepth 1 -type f \
                        \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.zip" \) \
                        -exec cp {} release/ \;
                  fi

                  echo "Release files:"
                  ls -lah release

            - name: Prepare release files (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path release | Out-Null

                  Get-ChildItem -Path dist -File |
                    Where-Object { $_.Name -like "*-setup.exe" } |
                    ForEach-Object {
                        Copy-Item $_.FullName "release/Indigo-${{ github.ref_name }}-Windows-x64-Setup.exe"
                    }

                  Write-Host "Release files:"
                  Get-ChildItem release

            - name: Upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: release/*
                  if-no-files-found: error

    release:
        name: Publish release
        needs: build
        runs-on: ubuntu-24.04

        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Flatten release files
              run: |
                  mkdir -p release
                  find dist -type f -exec mv {} release/ \;

                  echo "Final release files:"
                  ls -lah release

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: release/*
                  generate_release_notes: true
                  body: |
                      ## 📦 Installation

                      Download the build for your platform below. Notes are stored locally on your machine; Indigo never creates an account or uploads your writing.

                      See the [installation guide](https://github.com/prajwl-dh/indigo-app#installation-guide) for the first-launch steps on macOS, Windows, and Linux.
