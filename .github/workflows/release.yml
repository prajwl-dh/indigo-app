name: release-indigo

# Runs after a pull request is merged into main. It verifies the project,
# refuses to continue if the package.json version has already been released,
# builds every platform, and publishes the matching GitHub release.
on:
    push:
        branches:
            - main

permissions:
    contents: read

# Releases must run one at a time so two quick merges cannot race on the same
# version. Queued runs are not cancelled.
concurrency:
    group: release-main
    cancel-in-progress: false

env:
    CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
    # These two jobs intentionally carry the same names as the ones in
    # verify-indigo. GitHub matches required status checks by job name, so
    # "Verify" and "Electron end-to-end" must mean the same thing on a pull
    # request and on main.
    verify:
        name: Verify
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

    e2e:
        name: Electron end-to-end
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Electron needs the same shared libraries as Chromium, and the
            # runner image does not guarantee all of them.
            - name: Install Electron runtime libraries
              run: npx playwright-core install-deps chromium

            - name: Run Electron tests
              run: xvfb-run -a npm run test:e2e

    # Fail fast (in parallel with the checks above) so a merge that forgot to
    # bump the version does not spend an hour building installers.
    version:
        name: Check release version
        runs-on: ubuntu-24.04
        outputs:
            version: ${{ steps.resolve.outputs.version }}
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Resolve version from package.json
              id: resolve
              shell: bash
              run: |
                  version="$(node -p "require('./package.json').version")"

                  if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "::error::package.json version \"$version\" is not valid semver."
                      exit 1
                  fi

                  if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
                      echo "::error::Release v$version already exists. Bump \"version\" in package.json in the pull request before merging to main."
                      exit 1
                  fi

                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "Releasing v$version"

    build:
        name: Build ${{ matrix.artifact_name }}
        needs: [verify, version]
        strategy:
            fail-fast: false
            matrix:
                include:
                    # =====================
                    # LINUX
                    # =====================
                    - os: ubuntu-24.04
                      build_script: build:linux
                      artifact_name: indigo-linux-x64

                    - os: ubuntu-24.04-arm
                      build_script: build:linux
                      artifact_name: indigo-linux-arm64

                    # =====================
                    # MACOS
                    # =====================
                    - os: macos-15
                      build_script: build:mac-arm
                      artifact_name: indigo-macos-apple-silicon

                    - os: macos-15-intel
                      build_script: build:mac-intel
                      artifact_name: indigo-macos-intel

                    # =====================
                    # WINDOWS
                    # =====================
                    - os: windows-2025
                      build_script: build:win
                      artifact_name: indigo-windows-x64

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Electron app
              run: npm run ${{ matrix.build_script }}

            # =====================
            # PREPARE RELEASE FILES
            # =====================
            - name: Prepare release files (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                  mkdir -p release

                  if [[ "${{ matrix.artifact_name }}" == "indigo-macos-apple-silicon" ]]; then
                      cp dist/*-arm64.dmg "release/Indigo-v${{ needs.version.outputs.version }}-Mac-Apple-Silicon.dmg"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-macos-intel" ]]; then
                      cp dist/*-x64.dmg "release/Indigo-v${{ needs.version.outputs.version }}-Mac-Intel.dmg"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-linux-arm64" ]]; then
                      cp dist/*-arm64.AppImage "release/Indigo-v${{ needs.version.outputs.version }}-Linux-ARM64.AppImage"

                  elif [[ "${{ matrix.artifact_name }}" == "indigo-linux-x64" ]]; then
                      cp dist/*-x86_64.AppImage "release/Indigo-v${{ needs.version.outputs.version }}-Linux-x64.AppImage"

                  else
                      find dist -maxdepth 1 -type f \
                        \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.zip" \) \
                        -exec cp {} release/ \;
                  fi

                  echo "Release files:"
                  ls -lah release

            - name: Prepare release files (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path release | Out-Null

                  Get-ChildItem -Path dist -File |
                    Where-Object { $_.Name -like "*-setup.exe" } |
                    ForEach-Object {
                        Copy-Item $_.FullName "release/Indigo-v${{ needs.version.outputs.version }}-Windows-x64-Setup.exe"
                    }

                  Write-Host "Release files:"
                  Get-ChildItem release

            - name: Upload release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ matrix.artifact_name }}
                  path: release/*
                  if-no-files-found: error

    release:
        name: Publish release
        needs: [version, build]
        runs-on: ubuntu-24.04
        permissions:
            contents: write

        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v4
              with:
                  path: dist

            - name: Flatten release files
              run: |
                  mkdir -p release
                  find dist -type f -exec mv {} release/ \;

                  echo "Final release files:"
                  ls -lah release

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ needs.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: Indigo v${{ needs.version.outputs.version }}
                  files: release/*
                  generate_release_notes: true
                  body: |
                      ## 📦 Installation

                      Download the build for your platform below. Notes are stored locally on your machine; Indigo never creates an account or uploads your writing.

                      See the [installation guide](https://github.com/prajwl-dh/indigo-app#installation-guide) for the first-launch steps on macOS, Windows, and Linux.
